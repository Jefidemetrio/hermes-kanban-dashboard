<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Kanban Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
<div class="layout-wrapper">
  <aside class="sidebar">
    <div class="sidebar-brand">Hermes Kanban</div>
    <nav class="sidebar-nav">
      <a class="active"><i class="bx bxs-dashboard"></i> Dashboard</a>
      <a><i class="bx bx-user-check"></i> Perfis</a>
      <a><i class="bx bx-cog"></i> Config</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <h4 class="m-0">Painel de Tarefas</h4>
      <div class="topbar-actions">
        <select id="profileSelect" class="form-select form-select-sm">
          <option value="">Todos perfis</option>
          <option value="fernanda">fernanda</option>
          <option value="joao">joao</option>
          <option value="nina">nina</option>
          <option value="andre">andre</option>
        </select>
        <select id="statusSelect" class="form-select form-select-sm">
          <option value="">Todos status</option>
          <option value="todo">todo</option>
          <option value="ready">ready</option>
          <option value="running">running</option>
          <option value="done">done</option>
          <option value="archived">archived</option>
          <option value="blocked">blocked</option>
        </select>
        <button id="refreshBtn" class="btn btn-primary btn-sm"><i class="bx bx-refresh"></i></button>
        <span id="status" class="status-pill">Carregando...</span>
      </div>
    </header>
    <main class="content">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Estatísticas por Status</div>
            <div class="card-body"><div id="statusChart"></div><pre id="statsBox" style="display:none">...</pre></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Resumo por Assignee</div>
            <div class="card-body"><div id="assigneeChart"></div><div id="assigneeSummary"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Tarefas</span>
          <span class="badge bg-secondary" id="taskCount">0</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th>ID</th><th>Título</th><th>Status</th><th>Assignee</th><th>Criado</th><th>Concluído</th></tr>
              </thead>
              <tbody id="tasksTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
